<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial de tareas diarias</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="Titulo">
        <h1>Lista de tareas</h1>
    </div>
    <div class="estructura">
        <div class="container">
            <div class="Lista">
                <h2>Mis tareas</h2>
                <input type="text" id="Buscar" placeholder="Busque tareas...">
                <ul id="Lista-tarea"></ul>
            </div>
        </div>
        <div class="container">
            <form>
                <h2>Ingrese una nueva tarea</h2>
                <input type="date" id="fecha">
                <textarea id="descripcion" placeholder="Descripcion de la tarea..."></textarea>
                <button onclick="agregarTarea()">Agregar</button>
            </form>
        </div>
    </div>
</body>
</html>
