<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tareas diarias</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="Titulo">
        <h1>Lista de tareas</h1>
    </div>
    <div class="estructura">
        <div class="container">
            <div class="Lista">
                <h2>Mis tareas</h2>
                <input type="text" id="search" placeholder="Busque tareas...">
                <ul id="choreList"></ul>
            </div>
            <div id="contador">
                <h2>Tareas</h2>
            </div>
        </div>
        <div class="container">
            <form>
                <h2>Ingrese una nueva tarea</h2>
                <input type="date" id="date">
                <textarea id="description" placeholder="Descripcion de la tarea..."></textarea>
                <button type="button" onclick="aggTarea()">Agregar</button>
            </form>
        </div>
    </div>
    <script src="js/function.js"></script>
</body>
</html>
