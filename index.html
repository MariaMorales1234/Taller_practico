<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El juego del ahorcado</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>AHORCADO</h1>
    <p>¡Prueba tu intuición y aprovecha las oportunidades para ganar!</p>
    <div class="btn-play">
        <button onclick="play">Jugar</button>
    </div>
    <div class="contenedor">
        <section id="game">
            <div id="draw"></div>
            <br><br>
            <div id="word-cont" aria-label="hidden_word"></div>
            <br>
            <div id="letters" aria-label="Selection word"></div>
            <div id="errores"></div>
            <br>
            <div id="usedLetters">
            <div id="mensaje"></div>
            <h2>Letras usadas</h2>
            <p id="list">_</p>
        </div>
        </section>

    <aside id="infor">
        <div id="score">
            <h2>¡MARCADOR!</h2>
            <p>Victorias: <span id="win">0</span></p>
            <p>Derrotas: <span id="loser">0</span></p>
        </div>
    <br><br>
    <section id="history">
        <h2>Historial</h2>
        <ul id="game_history">
        </ul>
    </section>
    </aside>
    </div>
    <script src="js/function.js"></script>
</body>
</html>
